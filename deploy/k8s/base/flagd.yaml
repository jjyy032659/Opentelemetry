apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.13.3
          args:
            - start
            - --port
            - "8013"
            - --ofrep-port
            - "8016"
            - --uri
            - file:/etc/flagd/demo.flagd.json
          ports:
            - name: rpc
              containerPort: 8013
            - name: ofrep
              containerPort: 8016
          env:
            - name: FLAGD_METRICS_EXPORTER
              value: otel
            - name: FLAGD_OTEL_COLLECTOR_URI
              value: otel-collector:4317
            - name: GOMEMLIMIT
              value: 60MiB
          volumeMounts:
            - name: config
              mountPath: /etc/flagd
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: config
          configMap:
            name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: flagd
  ports:
    - name: rpc
      port: 8013
      targetPort: rpc
    - name: ofrep
      port: 8016
      targetPort: ofrep

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/part-of: otel-demo
    spec:
      initContainers:
        - name: wait-for-valkey
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until nc -z valkey-cart 6379; do echo waiting for valkey; sleep 2; done
      containers:
        - name: cart
          image: ghcr.io/open-telemetry/demo:2.2.0-cart
          ports:
            - name: grpc
              containerPort: 8080
          env:
            - name: CART_PORT
              value: "8080"
            - name: ASPNETCORE_URLS
              value: http://*:8080
            - name: VALKEY_ADDR
              value: valkey-cart:6379
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_SERVICE_NAME
              value: cart
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: cart
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc

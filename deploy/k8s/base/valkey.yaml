apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-cart
  labels:
    app.kubernetes.io/name: valkey-cart
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-cart
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.2-alpine3.23
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-cart
  labels:
    app.kubernetes.io/name: valkey-cart
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: valkey-cart
  ports:
    - name: redis
      port: 6379
      targetPort: redis

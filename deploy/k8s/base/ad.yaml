# The image name here is the short name "ad". The dev overlay rewrites it to
# the ECR repository and the tag GitHub Actions last pushed. Do not put the
# account id in this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad
  labels:
    app.kubernetes.io/name: ad
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ad
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
        - name: ad
          image: ad
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8080
          env:
            - name: AD_PORT
              value: "8080"
            - name: FLAGD_HOST
              value: flagd
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_SERVICE_NAME
              value: ad
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Netty unpacks a native library under /tmp, so this mount has to
            # be writable and executable. An emptyDir is both, by default.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ad
  labels:
    app.kubernetes.io/name: ad
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: ad
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc

apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
  labels:
    app.kubernetes.io/name: currency
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: currency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: currency
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
        - name: currency
          image: ghcr.io/open-telemetry/demo:2.2.0-currency
          ports:
            - name: grpc
              containerPort: 8080
          env:
            - name: CURRENCY_PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: currency
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: currency
  labels:
    app.kubernetes.io/name: currency
    app.kubernetes.io/part-of: otel-demo
spec:
  selector:
    app.kubernetes.io/name: currency
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc

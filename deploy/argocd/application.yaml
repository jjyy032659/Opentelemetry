# Connects this repository to the cluster.
#
# Apply it once, after Argo CD is installed:
#
#   kubectl apply -f deploy/argocd/application.yaml
#
# From then on, Argo CD is the thing that creates and updates the workloads.
# Terraform does not apply this manifest. The Application is a CRD, and the
# Kubernetes provider cannot plan a CRD that is not already in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jjyy032659/Opentelemetry.git
    targetRevision: main
    path: deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
